<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Translator / 万能翻译器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 1em;
            resize: vertical;
            background: rgba(255, 255, 255, 0.07);
            color: #e0e0e0;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        textarea[readonly] {
            background: rgba(255, 255, 255, 0.03);
            cursor: default;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin: 20px 0;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.07);
            color: #e0e0e0;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23aaa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-translate {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            flex-shrink: 0;
        }

        .btn-translate:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-translate:active {
            transform: translateY(0);
        }

        .btn-translate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .output-section {
            margin-top: 24px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status {
            text-align: center;
            padding: 10px;
            margin: 16px 0;
            border-radius: 10px;
            font-size: 0.9em;
            display: none;
        }

        .status.error {
            display: block;
            background: rgba(255, 71, 87, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        .status.success {
            display: block;
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .status.loading {
            display: block;
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .char-count {
            text-align: right;
            font-size: 0.8em;
            color: #888;
            margin-top: 4px;
        }

        .language-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            background: rgba(255, 255, 255, 0.08);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8em;
            color: #666;
        }

        footer a {
            color: #667eea;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px 18px;
            }

            h1 {
                font-size: 1.5em;
            }

            .controls {
                flex-direction: column;
            }

            select, .btn-translate {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Universal Translator</h1>
        <p class="subtitle">万能翻译器 · ユニバーサル翻訳機 · المترجم الشامل · Traductor Universal</p>

        <div class="language-badges">
            <span class="badge">🇺🇸 English</span>
            <span class="badge">🇨🇳 中文</span>
            <span class="badge">🇯🇵 日本語</span>
            <span class="badge">🇸🇦 العربية</span>
            <span class="badge">🇪🇸 Español</span>
            <span class="badge">🇫🇷 Français</span>
            <span class="badge">🇩🇪 Deutsch</span>
            <span class="badge">🇰🇷 한국어</span>
            <span class="badge">🇵🇹 Português</span>
            <span class="badge">🇷🇺 Русский</span>
        </div>

        <label for="inputText">📝 Input Text</label>
        <textarea id="inputText" placeholder="Type or paste any content here to translate..."></textarea>
        <div class="char-count"><span id="charCount">0</span> characters</div>

        <div class="controls">
            <select id="targetLang" aria-label="Select target language">
                <option value="zh-CN">🇨🇳 Chinese (Simplified) / 中文（简体）</option>
                <option value="zh-TW">🇨🇳 Chinese (Traditional) / 中文（繁體）</option>
                <option value="ja">🇯🇵 Japanese / 日本語</option>
                <option value="en" selected>🇺🇸 English / 英文</option>
                <option value="ar">🇸🇦 Arabic / العربية</option>
                <option value="es">🇪🇸 Spanish / Español</option>
                <option value="fr">🇫🇷 French / Français</option>
                <option value="de">🇩🇪 German / Deutsch</option>
                <option value="ko">🇰🇷 Korean / 한국어</option>
                <option value="pt">🇵🇹 Portuguese / Português</option>
                <option value="ru">🇷🇺 Russian / Русский</option>
                <option value="it">🇮🇹 Italian / Italiano</option>
                <option value="hi">🇮🇳 Hindi / हिन्दी</option>
                <option value="th">🇹🇭 Thai / ภาษาไทย</option>
                <option value="vi">🇻🇳 Vietnamese / Tiếng Việt</option>
                <option value="nl">🇳🇱 Dutch / Nederlands</option>
                <option value="tr">🇹🇷 Turkish / Türkçe</option>
            </select>
            <button class="btn btn-translate" id="translateBtn" onclick="translateText()">
                🔄 Translate
            </button>
        </div>

        <div id="statusMsg" class="status"></div>

        <div class="output-section">
            <div class="output-header">
                <label for="outputText">📄 Translation Result</label>
                <button class="btn btn-copy" onclick="copyResult()">📋 Copy</button>
            </div>
            <textarea id="outputText" readonly placeholder="Translation will appear here..."></textarea>
        </div>
    </div>

    <footer>
        <p>Powered by <a href="https://mymemory.translated.net/" target="_blank" rel="noopener">MyMemory Translation API</a></p>
        <p style="margin-top:4px;">AI-skills Project · Multilingual Prompt Engineering Demo</p>
    </footer>

    <script>
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const targetLang = document.getElementById('targetLang');
        const translateBtn = document.getElementById('translateBtn');
        const statusMsg = document.getElementById('statusMsg');
        const charCount = document.getElementById('charCount');

        // Character counter
        inputText.addEventListener('input', function () {
            charCount.textContent = this.value.length;
        });

        function showStatus(message, type) {
            statusMsg.className = 'status ' + type;
            statusMsg.innerHTML = message;
        }

        function hideStatus() {
            statusMsg.className = 'status';
            statusMsg.innerHTML = '';
        }

        function detectSourceLang(text) {
            // Simple heuristic detection based on Unicode ranges
            for (let i = 0; i < text.length; i++) {
                const code = text.charCodeAt(i);
                if (code >= 0x4E00 && code <= 0x9FFF) return 'zh-CN';  // CJK Unified - Chinese
                if (code >= 0x3040 && code <= 0x309F) return 'ja';      // Hiragana - Japanese
                if (code >= 0x30A0 && code <= 0x30FF) return 'ja';      // Katakana - Japanese
                if (code >= 0x0600 && code <= 0x06FF) return 'ar';      // Arabic
                if (code >= 0xAC00 && code <= 0xD7AF) return 'ko';      // Korean
                if (code >= 0x0E00 && code <= 0x0E7F) return 'th';      // Thai
                if (code >= 0x0900 && code <= 0x097F) return 'hi';      // Hindi
                if (code >= 0x0400 && code <= 0x04FF) return 'ru';      // Cyrillic - Russian
            }
            // Check for Spanish/French/German/Portuguese specific chars
            if (/[áéíóúñ¿¡ü]/i.test(text)) return 'es';
            if (/[àâçéèêëïîôùûüÿœæ]/i.test(text)) return 'fr';
            if (/[äöüß]/i.test(text)) return 'de';
            if (/[ãõçá]/i.test(text)) return 'pt';
            return 'en'; // Default to English
        }

        async function translateText() {
            const text = inputText.value.trim();

            if (!text) {
                showStatus('⚠️ Please enter some text to translate.', 'error');
                return;
            }

            if (text.length > 5000) {
                showStatus('⚠️ Text is too long. Please limit to 5000 characters.', 'error');
                return;
            }

            const target = targetLang.value;
            const source = detectSourceLang(text);

            // Disable button and show loading state
            translateBtn.disabled = true;
            translateBtn.innerHTML = '<span class="spinner"></span> Translating...';
            outputText.value = '';
            showStatus('⏳ Translating your text, please wait...', 'loading');

            try {
                // Split long text into chunks for the API (max ~500 chars per request for best results)
                const maxChunk = 500;
                const chunks = [];
                let remaining = text;

                while (remaining.length > 0) {
                    if (remaining.length <= maxChunk) {
                        chunks.push(remaining);
                        break;
                    }
                    // Try to break at a sentence boundary
                    let breakPoint = remaining.lastIndexOf('. ', maxChunk);
                    if (breakPoint === -1 || breakPoint < maxChunk * 0.3) {
                        breakPoint = remaining.lastIndexOf(' ', maxChunk);
                    }
                    if (breakPoint === -1 || breakPoint < maxChunk * 0.3) {
                        breakPoint = maxChunk;
                    }
                    chunks.push(remaining.substring(0, breakPoint + 1));
                    remaining = remaining.substring(breakPoint + 1);
                }

                const results = [];
                for (let i = 0; i < chunks.length; i++) {
                    const chunk = chunks[i];
                    const langPair = source + '|' + target;
                    const url = 'https://api.mymemory.translated.net/get?q='
                        + encodeURIComponent(chunk)
                        + '&langpair=' + encodeURIComponent(langPair);

                    const response = await fetch(url);

                    if (!response.ok) {
                        throw new Error('API request failed with status ' + response.status);
                    }

                    const data = await response.json();

                    if (data.responseStatus && data.responseStatus >= 400) {
                        throw new Error(data.responseDetails || 'Translation API returned an error.');
                    }

                    if (data.responseData && data.responseData.translatedText) {
                        results.push(data.responseData.translatedText);
                    } else {
                        throw new Error('Unexpected API response format.');
                    }

                    // Update progress for multi-chunk translations
                    if (chunks.length > 1) {
                        showStatus(
                            '⏳ Translating... (' + (i + 1) + '/' + chunks.length + ' segments)',
                            'loading'
                        );
                    }
                }

                const translated = results.join(' ');
                outputText.value = translated;
                showStatus('✅ Translation complete! (' + translated.length + ' characters)', 'success');
            } catch (error) {
                console.error('Translation error:', error);
                let userMessage = '❌ Translation failed. ';

                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    userMessage += 'Please check your internet connection and try again.';
                } else if (error.message.includes('status 429')) {
                    userMessage += 'Too many requests. Please wait a moment and try again.';
                } else {
                    userMessage += error.message;
                }

                showStatus(userMessage, 'error');
            } finally {
                translateBtn.disabled = false;
                translateBtn.innerHTML = '🔄 Translate';
            }
        }

        function copyResult() {
            const text = outputText.value;
            if (!text) {
                showStatus('⚠️ Nothing to copy. Please translate some text first.', 'error');
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function () {
                    showStatus('✅ Copied to clipboard!', 'success');
                }).catch(function () {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            outputText.select();
            try {
                document.execCommand('copy');
                showStatus('✅ Copied to clipboard!', 'success');
            } catch (err) {
                showStatus('❌ Copy failed. Please select the text manually and copy.', 'error');
            }
        }

        // Allow Ctrl+Enter to trigger translation
        inputText.addEventListener('keydown', function (e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                translateText();
            }
        });
    </script>
</body>
</html>
